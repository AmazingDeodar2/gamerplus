<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>评委相性测试</title>
<style>
:root {
  --bg: #f6f7fb;
  --card: #ffffff;
  --text: #222733;
  --muted: #667085;
  --line: #d9deea;
  --accent: #4f6bed;
  --accent-soft: #edf1ff;
  --danger: #c43d3d;
  --shadow: 0 10px 30px rgba(31, 44, 71, 0.06);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 28px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}
.container { max-width: 1180px; margin: 0 auto; }
.header {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 24px 28px;
  box-shadow: var(--shadow);
  margin-bottom: 20px;
}
h1 { margin: 0 0 8px; font-size: 30px; }
.tip { margin: 0; color: var(--muted); line-height: 1.7; }
.role-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
}
.role-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 18px;
  box-shadow: var(--shadow);
}
.role-head {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: flex-start;
  margin-bottom: 12px;
}
.role-title { margin: 0; font-size: 19px; line-height: 1.35; }
.role-id { color: var(--muted); font-size: 13px; margin-top: 4px; }
.type-badge {
  flex: 0 0 auto;
  background: var(--accent-soft);
  color: var(--accent);
  border: 1px solid #cfd8ff;
  border-radius: 999px;
  padding: 5px 10px;
  font-size: 13px;
  font-weight: 700;
}
.info-block {
  border-top: 1px solid var(--line);
  padding-top: 10px;
  margin-top: 10px;
}
.label {
  display: inline-block;
  font-weight: 800;
  color: #374151;
  margin-bottom: 5px;
}
.text {
  white-space: pre-wrap;
  line-height: 1.65;
  color: #30384c;
  font-size: 14px;
}
.empty { color: var(--muted); }
.score-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
}
.score-row span { font-weight: 800; }
input.score {
  width: 116px;
  padding: 10px 12px;
  border: 1px solid #b8c0d4;
  border-radius: 12px;
  font-size: 16px;
  text-align: center;
}
input.score:focus {
  outline: 2px solid rgba(79, 107, 237, .22);
  border-color: var(--accent);
}
.actions {
  position: sticky;
  bottom: 0;
  z-index: 10;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin: 20px 0 0;
  padding: 14px 0;
  background: linear-gradient(180deg, rgba(246,247,251,0), var(--bg) 25%);
  align-items: center;
}
button {
  border: 0;
  background: var(--accent);
  color: white;
  border-radius: 14px;
  padding: 12px 22px;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
}
button.secondary { background: #e8ebf4; color: #30384c; }
.result-card {
  display: none;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 22px 26px;
  box-shadow: var(--shadow);
  margin-top: 16px;
}
.result-title { font-size: 22px; margin: 0 0 10px; }
.result-title b { color: var(--accent); }
.percent { font-size: 36px; font-weight: 900; margin: 10px 0 16px; }
.error { color: var(--danger); font-weight: 800; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 520px; }
th, td { border-bottom: 1px solid var(--line); padding: 10px 8px; text-align: center; }
th { background: var(--accent-soft); }
.footer-note { color: var(--muted); font-size: 13px; margin-top: 8px; }
@media (max-width: 600px) {
  body { padding: 14px; }
  .role-grid { grid-template-columns: 1fr; }
  .header { padding: 20px; }
}
</style>
</head>
<body>
<div class="container">
  <section class="header">
    <h1>测试你最像哪位评委</h1>
    <p class="tip">请根据你对角色的评价输入 0–10 分，最多保留两位小数。提交后会将你的评分向量与7位评委的真实评分向量比较，距离越近，相似度越高。</p>
  </section>

  <main id="roleGrid" class="role-grid"></main>

  <div class="actions">
    <button onclick="calculateResult()">计算结果</button>
    <button class="secondary" onclick="clearScores()">清空评分</button>
    <span id="message" class="error"></span>
  </div>

  <section id="resultCard" class="result-card">
    <h2 class="result-title" id="bestText"></h2>
    <div class="percent" id="bestPercent"></div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>排名</th>
            <th>评委</th>
            <th>相似度</th>
            <th>距离</th>
          </tr>
        </thead>
        <tbody id="rankBody"></tbody>
      </table>
    </div>
    <p class="footer-note">相似度采用绝对距离换算：100% 表示与你的20个评分完全一致，0% 表示达到理论最大差距。</p>
  </section>
</div>

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function fieldBlock(label, content) {
  const safe = content ? escapeHtml(content) : '<span class="empty">无</span>';
  return `
    <div class="info-block">
      <div class="label">${label}</div>
      <div class="text">${safe}</div>
    </div>`;
}

function renderRoles() {
  const grid = document.getElementById("roleGrid");
  grid.innerHTML = DATA.roles.map((role, index) => `
    <article class="role-card">
      <div class="role-head">
        <div>
          <h2 class="role-title">${escapeHtml(role.name)}</h2>
          <div class="role-id">编号：${role.id}</div>
        </div>
        <span class="type-badge">${escapeHtml(role.type || "未分类")}</span>
      </div>
      ${fieldBlock("角色能力", role.ability)}
      ${fieldBlock("运作", role.operation)}
      ${fieldBlock("备注", role.note)}
      <div class="score-row">
        <span>你的评分</span>
        <input class="score" id="score-${index}" type="number" min="0" max="10" step="0.01" inputmode="decimal" placeholder="0-10" />
      </div>
    </article>
  `).join("");
}

function parseScores() {
  const scores = [];
  const pattern = /^(10(\.0{1,2})?|[0-9](\.\d{1,2})?)$/;
  for (let i = 0; i < DATA.roles.length; i++) {
    const input = document.getElementById(`score-${i}`);
    const raw = input.value.trim();
    if (!pattern.test(raw)) {
      input.focus();
      throw new Error(`第 ${i + 1} 个角色评分格式不正确，请输入0-10之间、最多两位小数的数字。`);
    }
    const value = Number(raw);
    if (Number.isNaN(value) || value < 0 || value > 10) {
      input.focus();
      throw new Error(`第 ${i + 1} 个角色评分超出范围，请输入0-10。`);
    }
    scores.push(value);
  }
  return scores;
}

function euclideanDistance(a, b) {
  let sum = 0;
  for (let i = 0; i < a.length; i++) {
    sum += Math.pow(a[i] - b[i], 2);
  }
  return Math.sqrt(sum);
}

function similarityFromDistance(distance, count) {
  const maxDistance = Math.sqrt(count * 100);
  return Math.max(0, (1 - distance / maxDistance) * 100);
}

function calculateResult() {
  const message = document.getElementById("message");
  message.textContent = "";
  try {
    const userScores = parseScores();
    const rankings = Object.entries(DATA.judges).map(([judge, scores]) => {
      const distance = euclideanDistance(userScores, scores);
      const similarity = similarityFromDistance(distance, userScores.length);
      return { judge, distance, similarity };
    }).sort((a, b) => b.similarity - a.similarity);

    const best = rankings[0];
    document.getElementById("resultCard").style.display = "block";
    document.getElementById("bestText").innerHTML = `你最像：<b>${escapeHtml(best.judge)}</b>`;
    document.getElementById("bestPercent").textContent = `${best.similarity.toFixed(2)}%`;

    document.getElementById("rankBody").innerHTML = rankings.map((item, idx) => `
      <tr>
        <td>${idx + 1}</td>
        <td>${escapeHtml(item.judge)}</td>
        <td><b>${item.similarity.toFixed(2)}%</b></td>
        <td>${item.distance.toFixed(4)}</td>
      </tr>
    `).join("");

    document.getElementById("resultCard").scrollIntoView({ behavior: "smooth", block: "start" });
  } catch (err) {
    document.getElementById("resultCard").style.display = "none";
    message.textContent = err.message;
  }
}

function clearScores() {
  DATA.roles.forEach((_, i) => {
    document.getElementById(`score-${i}`).value = "";
  });
  document.getElementById("message").textContent = "";
  document.getElementById("resultCard").style.display = "none";
}

renderRoles();
